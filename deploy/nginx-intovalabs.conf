# Example HTTP template only. Production HTTPS and certificate directives are managed on the VPS.
# Never copy this file over /etc/nginx/sites-available/intovalabs during an application deploy.
server {
    listen 80;
    listen [::]:80;
    server_name intovalabs.com www.intovalabs.com;

    root /opt/into-youth/static;
    index index.html;

    client_max_body_size 18m;

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        alias /opt/into-youth/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|gif|mp4|webm|ico|woff2)$ {
        expires 14d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
