name: Self-hosted verification
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run check:public
      - run: npm test
      - run: npm run test:server
      - run: npm run build
      - run: bash -n install.sh scripts/*.sh
  fresh-vps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate a new independent site configuration
        env:
          DOMAIN: archive.example.org
          ACME_EMAIL: owner@example.org
          ADMIN_USERNAME: owner@example.org
        run: python3 scripts/configure.py --non-interactive
      - name: Use HTTP only for isolated runner smoke testing
        run: |
          printf "services:\n  web:\n    environment:\n      DOMAIN: http://localhost\n    ports: !override\n      - '127.0.0.1:18080:80'\n" > compose.override.yaml
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: python3 scripts/health.py
      - name: Verify rendered website and API routing
        run: |
          curl --fail http://localhost:18080/ > /tmp/home.html
          grep -q '我的记忆档案' /tmp/home.html
          curl --fail http://localhost:18080/api/content > /tmp/content.json
          python3 -c "import json; d=json.load(open('/tmp/content.json')); assert len(d['media'])==16; assert d['settings']['contact_email']==''"
          bash scripts/backup.sh
          test -s "$(cat backups/latest.txt)/site.db"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 80
      - name: Stop test containers
        if: always()
        run: docker compose down
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-admin-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=GIT_COMMIT=${{ github.sha }} --dart-define=BUILD_TYPE=preview
      - uses: actions/upload-artifact@v4
        with:
          name: memory-archive-admin-preview
          path: mobile-admin-app/build/app/outputs/flutter-apk/app-debug.apk
  preview-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [website, fresh-vps, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: memory-archive-admin-preview
          path: release
      - name: Publish tested source and unsigned-for-production preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv release/app-debug.apk release/memory-archive-admin-preview.apk
          sha256sum release/memory-archive-admin-preview.apk > release/SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" release/memory-archive-admin-preview.apk release/SHA256SUMS.txt --latest --title "Self-hosted ${GITHUB_REF_NAME}" --notes-file docs/RELEASE.md
